<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Símbolo Ápse</title>
  <desc id="desc">Esfera vetorial verde-lima simplificada.</desc>
  <defs>
    <radialGradient id="orb" cx="30%" cy="22%" r="84%">
      <stop offset="0" stop-color="#F6FFE4"/>
      <stop offset="0.24" stop-color="#DFFF8B"/>
      <stop offset="0.58" stop-color="#B8FF34"/>
      <stop offset="1" stop-color="#78D000"/>
